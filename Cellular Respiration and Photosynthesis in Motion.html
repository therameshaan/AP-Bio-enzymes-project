<style>

<h1>Powering Life, Respiration and Photosynthesis</h1>

<div class="grid">

<section><h2>Chloroplast, photosynthesis</h2><div class="stage"><svg id="B" viewBox="0 0 600 740"></svg></div><div class="cap" id="cB"></div></section>
</div>
<div class="key" id="key"></div>

 const g=el(S.P,'g',{}),ci=el(g,'circle',{r,stroke:'#0b1220','stroke-width':1});
 el(g,'circle',{r:r*.35,cx:-r*.35,cy:-r*.35,fill:'#fff','fill-opacity':.55});
 const tx=el(g,'text',{x:r+3,y:3.5,class:'p'}),cu=[0];

 fl.push({g,ln,ci,tx,st,p,c,l,D,o,w,s,cu,L:cu[cu.length-1],k:-1});
}
const pos=(f,q)=>{const d=q*f.L;let i=0;while(i<f.p.length-2&&d>f.cu[i+1])i++;const a=f.p[i],b=f.p[i+1],u=(d-f.cu[i])/((f.cu[i+1]-f.cu[i])||1);return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u]};

F(A,'g',[[40,105],[120,105]],C.c,'Glucose',6,0,[0,.35],.5,13);
F(A,'g',[[120,105],[225,70]],C.c,'Pyruvate',6,0,[.35,.85]);

F(A,'g',[[35,172],[85,150],[125,175]],[C.nad,C.nadh],['2 NAD⁺','2 NADH'],6,0,[.3,.9]);

F(A,'l',[[225,70],[195,225],[150,330]],C.c,'Pyruvate',7,.5,[0,.5]);

F(A,'l',[[150,335],[132,470],[128,590]],C.nadh,'NADH',7,0,[.5,1]);

F(A,'k',arc(...K,90,175,6),C.pg,'oxaloacetate',8,0,[0,.2]);

F(A,'k',[P(20),[490,380],[520,260],[545,130]],C.co2,'CO₂',8,.2,[.35,.8]);
F(A,'k',[[500,330],P(335),[330,520],[135,592]],[C.nad,C.nadh],['NAD⁺','NADH'],8,0,[0,1],.2);
F(A,'k',[[470,520],P(60),[290,550],[140,595]],[C.nad,C.nadh],['NAD⁺','NADH'],8,.4,[0,1],.22);

F(A,'c',[[510,560],[486,578],[515,520]],[C.adp,C.atp],['ADP + Pi','ATP'],4,0);

F(B,'r',[[78,252],[118,280]],C.h2o,'H₂O',6,0,[0,.3]);
F(B,'r',[[118,280],[92,200],[70,118]],C.o2,'O₂',6,0,[.3,1]);
F(B,'r',[[118,280],[130,304]],C.e,'e⁻',6,0,[.3,.55],.5,6);

for(const o of[0,.5]){F(B,'r',[[135,302],[215,288],[295,302]],C.e,'e⁻',4,o,[0,1],.5,6);F(B,'r',[[305,302],[375,298],[380,336]],C.e,'e⁻',4,o+.25,[0,1],.5,6);F(B,'r',[[215,372],[215,296]],C.h,'H⁺',6,o,[0,.7]);F(B,'r',[[470,290],[470,330],[470,385]],C.h,'H⁺',4,o)}
F(B,'r',[[440,390],[384,348],[420,440],[392,540]],[C.nad,C.nadh],['NADP⁺','NADPH'],6,.1,[0,1],.25);

// controls
const stg={g:'Glycolysis',l:'Link reaction',k:'Citric acid cycle',e:'Electron transport',c:'Chemiosmosis',r:'Light reactions',v:'Calvin cycle'};
const cap={g:'Glycolysis in the cytoplasm splits one glucose into two pyruvate. It spends 2 ATP, makes 4 ATP and turns 2 NAD⁺ into 2 NADH.',l:'Link reaction. Pyruvate enters the matrix, releases CO₂ and joins coenzyme A to form acetyl CoA.',k:'Citric acid cycle. Acetyl CoA joins oxaloacetate to make citrate. Each turn releases CO₂ and yields NADH, FADH₂ and ATP.',e:'Electron transport chain. Electrons from NADH and FADH₂ move along the chain while H⁺ is pumped into the intermembrane space. At the end O₂ combines with electrons and H⁺ to form H₂O.',c:'Chemiosmosis. H⁺ flows back through ATP synthase, which spins and turns ADP + Pi into ATP (oxidative phosphorylation).',r:'Light reactions. Sunlight excites chlorophyll in PSII and PSI. Photolysis splits H₂O into O₂, e⁻ and H⁺. Electrons reduce NADP⁺ to NADPH, and H⁺ flowing through ATP synthase makes ATP (photophosphorylation).',v:'Calvin cycle. RuBisCO joins CO₂ to RuBP to make 3-PGA. ATP and NADPH convert 3-PGA to G3P. Five of every six G3P regenerate RuBP and one exits as sugar.'};

 $('#cA').textContent=k&&side(k)=='A'?cap[k]:d0;$('#cB').textContent=k&&side(k)=='B'?cap[k]:d0}
for(const[k,v]of[['','All stages'],...Object.entries(stg)]){const b=document.createElement('button');b.textContent=v;b.dataset.k=k;b.onclick=()=>setFocus(foc===k?'':k);$('#chips').appendChild(b)}

$('#pp').onclick=e=>{run=!run;e.target.textContent=run?'Pause':'Play'};
$('#sp').oninput=e=>sp=+e.target.value;

function loop(t){
 const dt=Math.min(.05,(t-last)/1e3);last=t;if(run)T+=dt*sp;
 for(const f of fl){
  const p=(T/f.D+f.o)%1,[a,b]=f.w;

 }
 for(const[g,x,y,s]of hd){g.setAttribute('cx',x+5*Math.sin(T*1.7+s));g.setAttribute('cy',y+4*Math.cos(T*1.3+s))}
 rot('#kr',T*30,355,425);rot('#kb',-T*30,300,572);rot('#ra',T*260,470,585);rot('#rb',T*260,470,352);

requestAnimationFrame(loop);
